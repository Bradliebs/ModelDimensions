# Curated knowledge pack: Microsoft 365 consultant reference (v1.9 starter).
#
# The first real working pack template for Microsoft 365 consulting / project
# architecture work. Built entirely from local curated Markdown field notes
# under demos/m365_sources/ — no web access and no live Microsoft Learn
# ingestion. The build script imports these into an isolated pack so retrieval
# and provenance can be validated with the matching eval file
# (demos/pack_eval_questions/m365_consultant_eval.jsonl) before anyone relies
# on it for client work.
#
# Authority is "reputable" (these are curated consultant notes, not official
# Microsoft documentation); domain is "microsoft". Every source carries
# version local-notes-v1 and a review_required staleness policy as a reminder
# to verify against current Microsoft guidance before client delivery.

pack_name: m365-consultant
description: >-
  Curated Microsoft 365 consulting reference built from local field notes
  (Purview, Defender for Cloud Apps, Copilot Studio, Power Platform, SharePoint).
default_domain: microsoft
default_knowledge_backend: deterministic
allow_url_ingestion: false
enabled: true

sources:
  - source_name: Purview Sensitivity Labels
    path_or_url: demos/m365_sources/purview_sensitivity_labels.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Endpoint DLP
    path_or_url: demos/m365_sources/endpoint_dlp.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Defender for Cloud Apps
    path_or_url: demos/m365_sources/defender_for_cloud_apps.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Copilot Studio Agent Patterns
    path_or_url: demos/m365_sources/copilot_studio_patterns.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Power Platform DLP
    path_or_url: demos/m365_sources/power_platform_dlp.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: SharePoint Governance
    path_or_url: demos/m365_sources/sharepoint_governance.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required
