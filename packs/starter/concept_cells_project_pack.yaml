# Curated knowledge pack: Concept Cells project documentation (v1.8 starter).
#
# Imports the repository's own architecture spec as curated project-docs
# knowledge — local file only, no web access. Kept separate from project
# *memory*: this is reference documentation, not a record of decisions.

pack_name: concept-cells-docs
description: Curated Concept Cells project documentation built from local docs.
default_domain: project_docs
default_knowledge_backend: deterministic
allow_url_ingestion: false
enabled: true

sources:
  - source_name: Concept Cells Architecture
    path_or_url: ARCHITECTURE.md
    domain: project_docs
    authority: official
    version: "0.7"
    licence: project-internal
    staleness_policy: review-on-release
