# v2.1 M365 / Coding Assistant Pack manifest
#
# Declarative recipe consumed by scripts/build_m365_coding_pack.py. The keys
# under the top level that the frozen PackBuildPlan understands (pack_name,
# description, default_domain, default_knowledge_backend, allow_url_ingestion,
# enabled, sources) are used to build the pack. The `policy` block below is a
# human-readable declaration that the build script validates the sources
# against; it does not change any frozen builder semantics.

pack_name: m365-coding-assistant-v21
description: >-
  Practical Microsoft 365 and coding assistant pack: curated local field notes
  for M365 administration, Purview labels and DLP, Power Platform / PowerApps
  formulas, SharePoint / Teams / Copilot Studio, and local coding-agent
  workflow rules. Answers are grounded in these sources only; the SLM layer is
  optional and evidence-bounded.

default_domain: microsoft
default_knowledge_backend: deterministic
allow_url_ingestion: false
enabled: true

# Declared policy (validated by the build script; not enforced by the frozen
# builder). These document the pack's guarantees.
policy:
  source_policy: local_only           # no URL or HF ingestion; curated files only
  allowed_knowledge_types: [microsoft, coding]
  stale_source_warning: enabled       # sources with a stale policy are labelled at query time
  medical_legal: disabled             # no medical/legal sources unless explicitly added later
  model_prior: labelled_only          # model-prior answers are allowed only when explicitly labelled
  # v2.2 source freshness policy. Used by scripts/build_m365_coding_pack.py to
  # produce a maintenance report. Time-based windows apply only to sources whose
  # staleness_policy is a date-based cadence; sources marked `stale` or
  # `review_required` short-circuit to stale / review_due regardless of age.
  freshness:
    default_stale_after_days: 365      # general/architecture notes age slowly
    domain_stale_after_days:
      microsoft: 180                   # M365 admin/Purview/Copilot guidance moves faster
      coding: 365
    review_due_fraction: 0.8           # flag for review at 80% of the window

sources:
  - source_name: Microsoft 365 Admin Patterns
    path_or_url: packs/m365_coding_assistant/sources/m365_admin_patterns.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Purview Sensitivity Labels and DLP
    path_or_url: packs/m365_coding_assistant/sources/purview_dlp_notes.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Power Platform PowerApps Formulas
    path_or_url: packs/m365_coding_assistant/sources/power_platform_formulas.md
    domain: microsoft
    authority: reputable
    version: local-notes-2023
    staleness_policy: stale

  - source_name: SharePoint Teams Copilot Studio Notes
    path_or_url: packs/m365_coding_assistant/sources/copilot_studio_notes.md
    domain: microsoft
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required

  - source_name: Local Coding-Agent Workflow Rules
    path_or_url: packs/m365_coding_assistant/sources/coding_agent_workflow.md
    domain: coding
    authority: reputable
    version: local-notes-v1
    staleness_policy: review_required
